name: Industrial indicator pull (World Bank)

on:
  schedule:
    - cron: "0 6 * * 1"   # 06:00 UTC every Monday -- this data updates rarely, so daily would be wasted runs
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: worldbank-indicators-pull
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run World Bank fetch script
        run: python scripts/fetch_worldbank_indicators.py

      - name: Commit and push updated log
        run: |
          if [ -f data/worldbank_indicator_log.csv ]; then
            git config user.name "lndc-radar-bot"
            git config user.email "actions@github.com"
            git add data/worldbank_indicator_log.csv
            git diff --cached --quiet || git commit -m "Update World Bank indicator log"
            git pull --rebase origin main
            git push
          else
            echo "No log file present this run -- nothing to commit."
          fi
