name: Compute anomaly signals & discovery feed

on:
  workflow_run:
    workflows:
      - "Macro indicator pull (World Bank, full SACU panel)"
      - "Trade basket pull (UN Comtrade, SACU AG2)"
      - "Compute proxy Economic Complexity (SACU-regional)"
      - "General signal pull (GDELT, auto-tagged)"
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: compute-signals
  cancel-in-progress: false

jobs:
  compute:
    # Proceed on a manual run regardless, or after any of the four upstream
    # workflows completes successfully. Doesn't require ALL four to have
    # just run -- this recomputes fresh from whatever data currently
    # exists each time, so firing after any single one finishing is
    # correct, not a race condition.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run signals computation
        run: python scripts/compute_signals.py

      - name: Commit and push updated output
        run: |
          if [ -f data/derived/anomaly_signals_log.csv ]; then
            git config user.name "lndc-radar-bot"
            git config user.email "actions@github.com"
            git add data/derived/anomaly_signals_log.csv data/derived/discovery_feed_log.csv
            git diff --cached --quiet || git commit -m "Recompute anomaly signals and discovery feed"
            git pull --rebase origin main
            git push
          else
            echo "No output file present this run -- nothing to commit."
          fi
