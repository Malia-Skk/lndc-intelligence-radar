name: Global signal pull (GDELT, non-Lesotho-scoped)

on:
  schedule:
    - cron: "0 7 * * *"   # daily, 07:00 UTC -- offset from both the automotive pilot (06:00) and general pull (06:30)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: global-signal-pull
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run global (non-Lesotho-scoped) GDELT fetch script
        run: python scripts/fetch_global_signal.py

      - name: Commit and push updated log
        run: |
          if [ -f data/news/global_signal_log.csv ]; then
            git config user.name "lndc-radar-bot"
            git config user.email "actions@github.com"
            git add data/news/global_signal_log.csv
            git diff --cached --quiet || git commit -m "Update global signal log"
            git pull --rebase origin main
            git push
          else
            echo "No log file present this run (the fetch likely failed after retries) - nothing to commit."
          fi
