name: Automotive trade pull (UN Comtrade)

on:
  schedule:
    - cron: "0 6 * * 1"   # weekly -- trade data updates infrequently
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: comtrade-automotive-pull
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run UN Comtrade fetch script
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
        run: python scripts/fetch_comtrade_automotive.py

      - name: Commit and push updated log
        run: |
          if [ -f data/comtrade_automotive_log.csv ]; then
            git config user.name "lndc-radar-bot"
            git config user.email "actions@github.com"
            git add data/comtrade_automotive_log.csv
            git diff --cached --quiet || git commit -m "Update UN Comtrade automotive log"
            git pull --rebase origin main
            git push
          else
            echo "No log file present this run -- nothing to commit."
          fi
