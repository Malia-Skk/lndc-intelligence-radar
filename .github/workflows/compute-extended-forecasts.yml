name: Compute extended forecasts

on:
  workflow_run:
    workflows:
      - "Macro indicator pull (World Bank, full SACU panel)"
      - "Compute proxy Economic Complexity (SACU-regional)"
      - "Compute trade analytics"
      - "Compute forecasts vs strategy targets"
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: compute-extended-forecasts
  cancel-in-progress: false

jobs:
  compute:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run extended forecasting computation
        run: python scripts/compute_extended_forecasts.py

      - name: Commit and push updated output
        run: |
          if [ -f data/derived/extended_forecast_log.csv ]; then
            git config user.name "lndc-radar-bot"
            git config user.email "actions@github.com"
            git add data/derived/extended_forecast_log.csv data/derived/required_pace_log.csv
            git diff --cached --quiet || git commit -m "Recompute extended forecasts"
            git pull --rebase origin main
            git push
          else
            echo "No output file present this run -- nothing to commit."
          fi
