name: Automotive signal pull (GDELT)

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC daily = ~08:00 Lesotho time
  workflow_dispatch: {}    # adds a manual "Run workflow" button for testing

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run GDELT fetch script
        run: python scripts/fetch_gdelt_automotive.py

      - name: Commit and push updated log
        run: |
          if [ -f data/automotive_signal_log.csv ]; then
            git config user.name "lndc-radar-bot"
            git config user.email "actions@github.com"
            git add data/automotive_signal_log.csv
            git diff --cached --quiet || git commit -m "Update automotive signal log"
            git push
          else
            echo "No log file present this run (the fetch likely failed after retries) - nothing to commit."
          fi
