name: Trade basket pull (UN Comtrade, World AG2) [DEFERRED]

# Schedule intentionally removed. First live run confirmed reporterCode="0"
# returns a clean empty response ("Received 0 raw records"), not an error --
# there is no pre-aggregated "World reporter" in Comtrade the way partnerCode
# ="0" validly means "World" as a partner. See config/sources.yaml
# (comtrade_world_basket, status: deferred) for the full reasoning and what
# would need to be true to revisit this. Left as workflow_dispatch-only so
# it can still be run by hand if/when that changes -- it should NOT run on
# a schedule while it produces zero rows every time.

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: comtrade-world-basket-pull
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run world trade basket fetch script
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
        run: python scripts/fetch_comtrade_world_basket.py

      - name: Commit and push updated log
        run: |
          if [ -f data/trade/comtrade_world_basket_log.csv ]; then
            git config user.name "lndc-radar-bot"
            git config user.email "actions@github.com"
            git add data/trade/comtrade_world_basket_log.csv
            git diff --cached --quiet || git commit -m "Update world trade basket log"
            # Retry the pull-rebase-push cycle: another workflow run can push to
            # main in the gap between this job checking out the repo and this
            # step running (a real, observed failure otherwise -- several of this
            # repo's workflows chain off multiple upstream triggers that can
            # complete close together). Each retry re-fetches the latest main and
            # re-applies this run's commit on top of it, rather than erroring out
            # on a base that went stale after checkout.
            push_succeeded=false
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin main && git push; then
                echo "Pushed successfully on attempt $attempt."
                push_succeeded=true
                break
              fi
              echo "Push attempt $attempt failed (likely a race with another workflow run writing to main)."
              git rebase --abort 2>/dev/null || true
              sleep 10
            done
            if [ "$push_succeeded" != "true" ]; then
              echo "Failed to push after 5 attempts. This run's computed result was not lost -- it will simply be recomputed and pushed on the next scheduled or triggered run."
              exit 1
            fi
          else
            echo "No log file present this run -- nothing to commit."
          fi
