name: Trade basket pull (UN Comtrade, World AG2) [DEFERRED]

# Schedule intentionally removed. First live run confirmed reporterCode="0"
# returns a clean empty response ("Received 0 raw records"), not an error --
# there is no pre-aggregated "World reporter" in Comtrade the way partnerCode
# ="0" validly means "World" as a partner. See config/sources.yaml
# (comtrade_world_basket, status: deferred) for the full reasoning and what
# would need to be true to revisit this. Left as workflow_dispatch-only so
# it can still be run by hand if/when that changes -- it should NOT run on
# a schedule while it produces zero rows every time.

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: comtrade-world-basket-pull
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run world trade basket fetch script
        env:
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
        run: python scripts/fetch_comtrade_world_basket.py

      - name: Commit and push updated log
        run: |
          if [ -f data/trade/comtrade_world_basket_log.csv ]; then
            git config user.name "lndc-radar-bot"
            git config user.email "actions@github.com"
            git add data/trade/comtrade_world_basket_log.csv
            git diff --cached --quiet || git commit -m "Update world trade basket log"
            git pull --rebase origin main
            git push
          else
            echo "No log file present this run -- nothing to commit."
          fi
