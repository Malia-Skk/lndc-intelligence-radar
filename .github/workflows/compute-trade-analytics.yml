name: Compute trade analytics

on:
  workflow_run:
    workflows:
      - "Trade basket pull (UN Comtrade, SACU AG2)"
      - "Macro indicator pull (World Bank, full SACU panel)"
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: compute-trade-analytics
  cancel-in-progress: false

jobs:
  compute:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run trade analytics computation
        run: python scripts/compute_trade_analytics.py

      - name: Commit and push updated output
        run: |
          if [ -f data/derived/diversification_index_log.csv ]; then
            git config user.name "lndc-radar-bot"
            git config user.email "actions@github.com"
            git add data/derived/diversification_index_log.csv data/derived/emerging_products_log.csv data/derived/bop_tracker_log.csv
            git diff --cached --quiet || git commit -m "Recompute trade analytics"
            git pull --rebase origin main
            git push
          else
            echo "No output file present this run -- nothing to commit."
          fi
