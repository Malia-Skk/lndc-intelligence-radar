name: Compute sector discovery

on:
  workflow_run:
    workflows:
      - "Compute anomaly signals & discovery feed"
      - "Global signal pull (GDELT, non-Lesotho-scoped)"
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: compute-sector-discovery
  cancel-in-progress: false

jobs:
  compute:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run sector discovery computation
        run: python scripts/compute_sector_discovery.py

      - name: Commit and push updated output
        run: |
          if [ -f data/derived/sector_discovery_log.csv ]; then
            git config user.name "lndc-radar-bot"
            git config user.email "actions@github.com"
            git add data/derived/sector_discovery_log.csv
            git diff --cached --quiet || git commit -m "Recompute sector discovery candidates"
            git pull --rebase origin main
            git push
          else
            echo "No output file present this run -- nothing to commit."
          fi
