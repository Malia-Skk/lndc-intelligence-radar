# LNDC Intelligence Radar — Source Registry
#
# Single source of truth for what the radar ingests. Adding a country to an
# existing pull, or adding a brand-new source, should mean editing this file —
# not writing a new script from scratch. Each fetch script under scripts/
# reads its own section here at run time via scripts/lib/registry.py.
#
# status: active  -> a fetch script + GitHub Actions workflow exist and run on schedule
# status: planned -> named and scoped, not yet built (Phase 5 in the roadmap)
#
# This file intentionally does NOT touch the three original automotive-pilot
# sources (worldbank_indicator_log.csv, comtrade_automotive_log.csv,
# automotive_signal_log.csv) or their scripts. Those keep running exactly as
# they do today; they're just not re-described here.

version: 1

# Reusable country groups, referenced by id from within a source entry.
countries:
  sacu:
    - { name: Lesotho,      iso3: LSO, comtrade_code: "426" }
    - { name: South Africa, iso3: ZAF, comtrade_code: "710" }
    - { name: Botswana,     iso3: BWA, comtrade_code: "072" }
    - { name: Namibia,      iso3: NAM, comtrade_code: "516" }
    - { name: Eswatini,     iso3: SWZ, comtrade_code: "748" }

sources:

  # ---------------------------------------------------------------------
  # PHASE 1 — ACTIVE
  # ---------------------------------------------------------------------

  - id: worldbank_macro
    category: macro
    status: active
    description: >
      Full SACU macro panel (widened from the automotive pilot's LSO-vs-ZAF,
      5-indicator pull). Feeds the macro instrument panel tile and the
      diagnosis-linked BOP-gap indicator.
    script: scripts/fetch_worldbank_macro.py
    workflow: .github/workflows/worldbank-macro-pull.yml
    cadence: "weekly, Mon 06:30 UTC"
    output: data/macro/worldbank_indicator_log.csv
    countries: sacu
    date_range: "2010:2026"
    indicators:
      - code: NY.GDP.PCAP.KD.ZG
        name: "GDP per capita growth (annual %)"
        outcome_link: "Outcome 2 — 7% exit growth target"
      - code: NY.GDP.PCAP.CD
        name: "GDP per capita (current US$)"
        outcome_link: "Diagnosis Fig.2 — SACU wealth-gap comparison"
      - code: BN.CAB.XOKA.GD.ZS
        name: "Current account balance (% of GDP)"
        outcome_link: "Diagnosis Ch.1.3 — balance-of-payments constraint"
      - code: NE.RSB.GNFS.ZS
        name: "External balance on goods and services (% of GDP)"
        outcome_link: "Diagnosis Ch.1.3 — trade balance"
      - code: NE.EXP.GNFS.ZS
        name: "Exports of goods and services (% of GDP)"
        outcome_link: "Diagnosis Ch.1.3/1.6 — export capacity"
      - code: NE.IMP.GNFS.ZS
        name: "Imports of goods and services (% of GDP)"
        outcome_link: "Diagnosis Ch.1.3 — import dependence"
      - code: NV.IND.MANF.ZS
        name: "Manufacturing, value added (% of GDP)"
        outcome_link: "Outcome 4 — industrial diversification"
      - code: NV.IND.TOTL.ZS
        name: "Industry (incl. construction), value added (% of GDP)"
        outcome_link: "Outcome 4 — industrial diversification"
      - code: TX.VAL.MANF.ZS.UN
        name: "Manufactured exports (% of merchandise exports)"
        outcome_link: "Outcome 5 — economic complexity"
      - code: BX.KLT.DINV.WD.GD.ZS
        name: "FDI, net inflows (% of GDP)"
        outcome_link: "Outcome 3 — FDI/industrialist pipeline"
      - code: SL.UEM.TOTL.ZS
        name: "Unemployment, total (% of total labor force)"
        outcome_link: "Outcome 1 — 50,000 net jobs"
      - code: SP.POP.TOTL
        name: "Population, total"
        outcome_link: "Normalisation base for per-capita indicators"
      - code: BX.TRF.PWKR.CD.DT
        name: "Personal remittances, received (current US$)"
        outcome_link: "Phase 5 — labour/remittance domain (major informal income channel from Basotho employed in South Africa)"
      - code: BX.TRF.PWKR.DT.GD.ZS
        name: "Personal remittances, received (% of GDP)"
        outcome_link: "Phase 5 — labour/remittance domain, normalised"

  - id: comtrade_sacu_basket
    category: trade
    status: active
    description: >
      Each SACU member's full export/import basket at the HS 2-digit
      chapter level ("AG2" aggregate — one call per flow returns all ~97
      chapters, rather than one call per product). This is the country-side
      input to Phase 2's proxy Economic Complexity / Fitness computation.
    script: scripts/fetch_comtrade_sacu_basket.py
    workflow: .github/workflows/comtrade-sacu-basket-pull.yml
    cadence: "weekly, Mon 07:00 UTC"
    output: data/trade/comtrade_sacu_basket_log.csv
    countries: sacu
    cmd_level: "AG2"
    flows: ["M", "X"]
    years_lookback: 8
    requires_secret: COMTRADE_API_KEY

  - id: comtrade_world_basket
    category: trade
    status: deferred
    description: >
      DEFERRED as of the first live run: reporterCode="0" was assumed to
      return a pre-aggregated "World reporter" total, mirroring how
      partnerCode="0" validly means "World" as a partner. It doesn't --
      the live run returned "Received 0 raw records," confirmed as a clean
      empty response, not an error. Building a real global total means
      summing every actual reporting country (~200 codes), which risks
      guessing wrong on Comtrade's non-ISO historical numbering (India is
      one known exception) with no way to verify from this environment.
      Not worth the risk: Outcome 5 targets "#1 in SACU", not a global
      rank, so Phase 2's proxy-ECI uses comtrade_sacu_basket_log.csv alone
      (SACU-relative RCA) instead of needing this at all. Revisit only if
      a genuinely global figure is wanted later -- the honest path then is
      a bulk dataset (e.g. CEPII's BACI, built from Comtrade, downloadable
      as flat files) rather than looping API calls per country.
    script: scripts/fetch_comtrade_world_basket.py
    workflow: .github/workflows/comtrade-world-basket-pull.yml
    cadence: "disabled -- workflow_dispatch only, no schedule"
    output: data/trade/comtrade_world_basket_log.csv
    reporter: "0"
    cmd_level: "AG2"
    flows: ["X"]
    years_lookback: 8
    requires_secret: COMTRADE_API_KEY

  - id: gdelt_general
    category: news
    status: active
    description: >
      General Lesotho/LNDC economic-development news signal, replacing the
      automotive pilot's single-sector scope. REVISED after a live run: the
      first version used one query with ~30 OR'd terms, which GDELT rejected
      outright ("Your query was too short or too long", HTTP 200) --
      confirmed evidence of a real complexity/length limit, not a guess.
      Now split into 5 smaller query buckets (trade_investment,
      industry_sectors, policy_finance, infrastructure_risk,
      emerging_niche), each sized like the automotive pilot's proven,
      already-working query (~6-9 terms), run sequentially and merged with
      cross-bucket URL dedup. Every article is auto-tagged by
      scripts/lib/tagging.py against a fixed rule-based category list
      (textiles_apparel, mining_minerals, energy_water, fdi_investment,
      trade_policy, labour_remittance, climate_food_security,
      governance_political, and others -- see tagging.py for the full set),
      matched against article titles only (GDELT's DOC API doesn't return
      full body text in this mode, so under-tagging on vague titles is
      expected, not a bug). An article matching zero categories isn't
      discarded -- it's kept with an empty tags field, forming a "discovery
      feed" of things happening that don't fit an existing bucket yet.
      Tagging is rule-based (free, offline, deterministic) rather than
      LLM-based for this phase; an LLM-assisted fallback for ambiguous
      titles is a reasonable future addition once the narrative layer
      exists, not built here.
    script: scripts/fetch_gdelt_general.py
    workflow: .github/workflows/gdelt-general-pull.yml
    cadence: "daily, 06:30 UTC"
    output: data/news/general_signal_log.csv
    tagging_categories: scripts/lib/tagging.py (CATEGORY_KEYWORDS)

  - id: global_signal
    category: news
    status: active
    description: >
      Phase A of the predictive-analytics expansion (per the LNDC
      Industrial Intelligence Radar diagnostic report, Chapter 8.2) --
      global signal monitoring, deliberately NOT scoped to "Lesotho"
      appearing in the article, unlike gdelt_general above. That
      script's every query requires "Lesotho" in the text, which is
      exactly right for Lesotho's own situation but structurally cannot
      catch a shift before it reaches Lesotho -- the report's own
      illustrative Radar questions ("what global apparel-sourcing shifts
      could create relocation opportunities for Lesotho?") are about
      signal that hasn't mentioned Lesotho yet. Four query buckets, each
      sized 8-10 terms (safely inside the proven-working range
      established by gdelt_general's own revision history above): global
      apparel-sourcing shifts, global data-centre investment, critical-
      minerals investment among SACU peers specifically, and AGOA/AfCFTA/
      trade-preference policy news. Each article is checked (via
      scripts/lib/peer_relevance.py, reusing tagging.py's exact safe
      word-boundary matcher) against a curated list of countries directly
      comparable to Lesotho's situation for that bucket -- a mention of
      Vietnam in an apparel-sourcing story reads differently to a human
      reviewer than a mention of Germany. These country lists are
      explicitly curated judgement calls, not an authoritative
      classification, and will need periodic review as global patterns
      shift.

      REVISED after a real first live run surfaced three genuine issues:
      (1) the FIRST bucket queried was rate-limited on all 4 attempts
      while later buckets increasingly succeeded despite also hitting
      429s -- evidence of a rate-limit window clearing over elapsed
      wall-clock time during the run, disadvantaging whichever bucket
      happens to go first. Fixed with a second retry pass, run only
      after every bucket has had its first turn, so an early bucket gets
      a real second chance once more time has elapsed. (2) sourcelang
      was passed as a separate URL parameter, which GDELT silently
      ignored -- confirmed directly: one bucket returned only 75%
      English results, the rest spread across French, Chinese, Spanish,
      and 8 other languages. Fixed by moving sourcelang:english into
      each query string itself, matching gdelt_general's own already-
      proven pattern exactly rather than a fresh, untested parameter
      choice. (3) only 7 of 437 real articles were flagged as mentioning
      a comparable country, partly a real consequence of (2) (word-
      boundary matching against English country names structurally
      cannot work on non-English titles) and partly the genuine, honest
      limit of title-only matching. Improved, not solved, by also
      checking the article's own sourcecountry field (99% populated in
      the real run, and language-independent) as a second, clearly-
      labelled, weaker signal alongside title matches.
    script: scripts/fetch_global_signal.py
    workflow: .github/workflows/global-signal-pull.yml
    cadence: "daily, 07:00 UTC"
    output: data/news/global_signal_log.csv
    relevance_matching: scripts/lib/peer_relevance.py


  # ---------------------------------------------------------------------
  # PLANNED — named and scoped now so Phase 5 is "fill this in", not
  # "figure out what belongs here". Not fetched yet; no script/workflow.
  # ---------------------------------------------------------------------

  - id: agoa_status
    category: trade_policy
    status: deferred_no_free_api
    description: >
      AGOA eligibility review status — critical single-point risk for the
      garments sector. Checked in Phase 5: AGOA eligibility determinations
      are published via USTR/Federal Register notices and press releases,
      not a structured API. Building a scraper against a government
      notice page is exactly the kind of fragile, high-maintenance
      dependency this project has otherwise avoided -- one page redesign
      silently breaks it with no error a free-tier API would surface.
      Real, partial coverage already exists via gdelt_general's
      trade_policy bucket (explicitly includes "AGOA" as a search term) --
      see the actual AGOA renewal story that surfaced in Phase 3's first
      live run. Revisit only if USTR/AGOA.gov ever exposes a real feed.

  - id: sacu_revenue_pool
    category: fiscal
    status: deferred_no_free_api
    description: >
      SACU customs revenue-sharing pool size and Lesotho's allocation —
      large, volatile share of the fiscal base. Checked in Phase 5: this
      is published via SACU Secretariat annual reports and member states'
      national budget speeches (PDFs), not an API. Same reasoning as
      agoa_status -- a PDF-scraper is fragile in a way a free API isn't.
      Partial coverage exists via gdelt_general's fiscal_sacu tag and
      policy_finance query bucket. IMF Article IV consultation reports
      (also PDF, published annually, freely downloadable) are the best
      actual source of this figure if a human wants to read it directly --
      not a candidate for automated ingestion the same way.

  - id: central_bank_lesotho
    category: monetary
    status: deferred_no_free_api
    description: >
      CBL policy releases, reserves, loti/rand peg and CMA-related data.
      Checked in Phase 5: Lesotho's central bank, like most small-country
      central banks, publishes through PDF releases and its own website,
      not a structured API. Partial coverage exists via gdelt_general's
      monetary_currency tag and policy_finance query bucket (explicitly
      includes "central bank" and "loti" as search terms).

  - id: ilostat_labour
    category: labour
    status: deferred
    description: >
      ILO modelled employment estimates and remittance-adjacent labour
      indicators. ILOSTAT does have a real, documented API (SDMX-based),
      unlike the three sources above -- this isn't a "no free API exists"
      case. Deferred instead because the exact SDMX query syntax needs
      live verification I can't do from this environment, and the core
      labour-market need is already reasonably served by
      worldbank_macro's SL.UEM.TOTL.ZS (unemployment) and the new
      remittance indicators added in Phase 5 -- the marginal value of
      getting SDMX syntax right on the first guess didn't justify the
      risk right now. Worth revisiting on its own once someone can verify
      a real ILOSTAT API call, rather than guessed at blind alongside five
      other new sources at once.

  - id: remittances
    category: labour
    status: superseded_by_worldbank_macro
    description: >
      Remittance inflows — a major informal income channel from Basotho
      employed in South Africa. As of Phase 5, covered by two indicators
      added directly to worldbank_macro (BX.TRF.PWKR.CD.DT and
      BX.TRF.PWKR.DT.GD.ZS) rather than a separate source — this is a
      country-level annual aggregate, not the granular remittance-corridor
      or migrant-worker-count detail a dedicated source might eventually
      offer, but it's real, free, and already flowing through a proven
      pipeline with zero new code. This entry stays in the registry to
      record that decision, not because a separate fetch is still needed.

  - id: forex_rates
    category: macro
    status: active
    description: >
      Phase 13 — USD/ZAR exchange rate via Frankfurter.app (free, keyless,
      ECB-backed, chosen specifically to avoid the unofficial-scraper risk
      category already ruled out for Google Trends). Lesotho's Loti has
      been pegged 1:1 to the Rand since 1974 under the Common Monetary
      Area — there is no separate LSL rate to fetch; ZAR/USD IS the
      Loti's dollar rate. HONEST LIMITATION: this build environment has
      no network access to frankfurter.app (confirmed directly, not
      assumed), so the live API call itself was never verified before
      shipping — only the parsing/error-handling logic was, via 6 mocked
      response scenarios (well-formed, missing key, empty, malformed
      entry, HTTP error, retry exhaustion). Check the first real run's
      Actions log as the actual test, the way every other new source in
      this project gets verified against live data after merging.
    script: scripts/fetch_forex_rates.py
    workflow: .github/workflows/forex-rates-pull.yml
    cadence: "weekly, Mon 06:45 UTC"
    output: data/macro/forex_rate_log.csv
    date_range: "2010-01-01.."

  - id: fuel_energy_prices
    category: macro
    status: deferred_no_free_api
    description: >
      Fuel/energy prices — considered for Phase 13 alongside the forex
      feed. Checked and deferred: a free, keyless, reliably-documented
      JSON API for crude oil/energy prices specifically is materially
      less certain than forex (Frankfurter-quality options don't have a
      commodities equivalent this project is confident in), and the
      realistic free alternatives fall into the same unofficial-scraper
      risk category already ruled out for Google Trends. Partial
      coverage exists via gdelt_general's energy_water news tag. Revisit
      if a genuinely free, documented, non-scraper commodity-price API
      is identified later.

  - id: reliefweb_signals
    category: climate
    status: active
    description: >
      Humanitarian/food-security/climate signal for Lesotho via the
      ReliefWeb API (api.reliefweb.int) -- relevant to grains/poultry and
      agro-processing. FEWS NET itself (the original idea for this entry)
      doesn't appear to expose a comparable free structured API on the
      same tier as ReliefWeb's -- ReliefWeb aggregates situation reports,
      appeals, and disaster updates from many sources including FEWS
      NET-adjacent content, so it's used here as the actual mechanism.
      Two real issues found and fixed via live testing before this went
      active: (1) pointed at the decommissioned /v1/ endpoint -- the
      API's own error named the fix, switched to /v2/, confirmed
      compatible per ReliefWeb's own docs. (2) blocked on a pre-approved
      appname requirement (as of 1 Nov 2025) -- confirmed via a live 403,
      requested via https://apidoc.reliefweb.int/parameters#appname, and
      now approved. ReliefWeb adjusted the requested name to meet their
      naming standards; the actual issued appname
      ("Lndc-forecasting-fuoewfr-freouf79Ke") is set in the script.
      STILL GENUINELY UNVERIFIED: this script has never received a real
      200 response -- only the 410 and 403 above. The assumed response
      field structure (fields.title, fields.source[].name, etc.) is a
      best-effort guess from ReliefWeb's documentation, not confirmed
      against real data. Coded to degrade gracefully and log the raw
      response shape if that guess is wrong, but the first real run's
      Actions log is the actual test here, same as every other new
      source in this project.
    script: scripts/fetch_reliefweb_signals.py
    workflow: .github/workflows/reliefweb-signal-pull.yml
    cadence: "daily, 06:45 UTC"
    output: data/climate/reliefweb_signal_log.csv

  - id: infrastructure_capacity
    category: infrastructure
    status: deferred_no_free_api
    description: >
      LHWP phase progress, LEC generation capacity, WASCO — gates
      industrial estate capacity. Checked in Phase 5: none of these three
      utilities/projects expose a public API; LHWP publishes periodic
      technical progress reports (PDF), LEC and WASCO have no known open
      data feed. Partial coverage exists via gdelt_general's energy_water
      tag and infrastructure_risk query bucket (explicitly includes
      "Highlands Water" and "electricity" as search terms) -- see the LEC
      governance story that surfaced in Phase 3's first live run.

  - id: governance_signal
    category: governance
    status: deferred_no_free_api
    description: >
      Parliament bill tracking, DCEO case activity, election calendar —
      investor-confidence leading indicators. Checked in Phase 5: no
      structured API found for any of these -- Lesotho's Parliament and
      DCEO publish through their own websites and press statements, not
      open data feeds. Partial coverage exists via gdelt_general's
      governance_political tag and the "parliament" term already in the
      emerging_niche query bucket -- see the PM/AU-summit story that
      surfaced in Phase 3's first live run.

  - id: pipeline_industrialists
    category: investment
    status: active
    description: >
      The FDI/Basotho-industrialist investment pipeline (company names,
      deal stages, negotiation status). UNLIKE every other source in this
      registry, there is no public API here -- this is a
      manually-maintained spreadsheet LNDC produces periodically. An
      earlier version of this design routed it through a separate private
      repo with an authenticated read path, given the sensitivity of
      company-level deal data; that was explicitly set aside in favour of
      treating it the same as every other source here, so it is now public
      like everything else in this repo. Cleaning is handled by
      scripts/clean_pipeline_snapshot.py, which fixes real, confirmed
      data-quality issues found in the actual source file (whitespace
      inconsistency across five columns, country-name aliasing, mixed
      numeric/"TBD" factory-size values) and computes a stage-weighted
      "expected jobs" figure, explicitly tagged as an assumption
      (stage_probability_source: assumption_v1) since no snapshot history
      exists yet to derive real conversion rates from. "Estimated
      employment at full capacity" is never treated as confirmed/realised
      jobs -- see the script's module docstring for why. As of the first
      snapshot (2026-08-16): 26 leads, ~10,777 potential jobs at full
      capacity, ~5,922 weighted by assumed stage-conversion odds, 6 DI
      (Basotho-origin) leads of which exactly 3 clear the >=100-employee
      bar to even be CANDIDATES toward Outcome 3 -- the confirmed count of
      actual new Basotho industrialists remains 0.
    canonical_source_tab: "Pipeline (of the source workbook's several tabs -- others were found to disagree with it and each other)"
    script: scripts/clean_pipeline_snapshot.py
    workflow: .github/workflows/clean-pipeline-snapshot.yml
    trigger: "push to data/pipeline/raw/*.xlsx, plus workflow_dispatch"
    outputs:
      - data/pipeline/pipeline_canonical_latest.csv
      - data/pipeline/pipeline_canonical_<date>.csv (archived per snapshot)
      - data/pipeline/pipeline_snapshot_archive.csv (one summary row per snapshot)
      - data/pipeline/pipeline_data_quality_log.csv

# ---------------------------------------------------------------------
# PHASE 2 — DERIVED COMPUTATIONS
#
# Unlike `sources` above, these don't call an external API — they read
# already-ingested data and compute something new from it. They therefore
# fully overwrite their output on every run (not append-and-dedup like a
# fetch script), since a recomputation should always reflect the complete,
# current state of its inputs, not accumulate a history of past runs.
# ---------------------------------------------------------------------

computations:

  - id: proxy_eci
    category: macro
    status: active
    description: >
      Proxy Economic Complexity for Lesotho and SACU peers, computed via the
      Fitness-Complexity algorithm (Tacchella, Cristelli & Pietronero 2012)
      on a SACU-regional Revealed Comparative Advantage matrix. Explicitly a
      SACU-relative proxy, not a globally-comparable ECI — Lesotho has no
      official Atlas score, and computing a true global one was deferred
      (see comtrade_world_basket above). This is directly aligned with
      Outcome 5's actual target ("#1 in SACU"), not a workaround for it.
    inputs: [comtrade_sacu_basket]
    min_countries_required: sacu   # a year is skipped entirely if any SACU country is missing export data for it
    script: scripts/compute_proxy_eci.py
    workflow: .github/workflows/compute-proxy-eci.yml
    trigger: "runs automatically after comtrade_sacu_basket finishes updating, plus workflow_dispatch"
    outputs:
      - data/derived/proxy_eci_log.csv
      - data/derived/proxy_eci_top_products_log.csv

  - id: anomaly_signals
    category: cross-cutting
    status: active
    description: >
      Phase 6 -- anomaly detection across every long-running numeric
      series already ingested (macro, trade, proxy-ECI), plus a news
      discovery feed. Method: for each series, is the latest
      period-over-period change unusual relative to that series' own
      historical changes (z-score against prior changes, min 3 prior
      changes required to evaluate at all)? Deliberately a simple
      screening heuristic, not a rigorous statistical test -- see
      lib/anomaly.py's docstring. Trade series are pre-filtered to those
      accounting for >=0.5% of that reporter's own total trade (a
      RELATIVE threshold, not an absolute dollar amount, so Lesotho's
      meaningful products aren't crowded out by South Africa's larger
      economy) -- checked against real data before picking that number
      (272 of 968 series, 56 of them Lesotho's). Verified against this
      project's actual live data: correctly re-discovered and quantified
      a real, dramatic jump already informally noted much earlier in this
      project (Lesotho's beverages/spirits exports: steady $57-86M for six
      years, then $188M in 2024, z=8.2) -- confirming the method surfaces
      genuinely real signal, not noise. The discovery feed (untagged
      gdelt_general articles) is a surfacing of existing data, not a
      statistical computation -- there isn't enough news-pull history yet
      for a volume-anomaly check on tag frequency, though that's a direct
      future extension of the same lib/anomaly.py function once enough
      daily runs accumulate.
    inputs: [worldbank_macro, comtrade_sacu_basket, proxy_eci, gdelt_general]
    script: scripts/compute_signals.py
    workflow: .github/workflows/compute-signals.yml
    trigger: "runs automatically after any of its 4 input sources updates, plus workflow_dispatch"
    outputs:
      - data/derived/anomaly_signals_log.csv
      - data/derived/discovery_feed_log.csv

  - id: forecasts
    category: cross-cutting
    status: active
    description: >
      Phase 7 -- the actual predictive-analytics piece. Projects GDP per
      capita growth and SACU-regional complexity rank forward using OLS
      linear trend + t-distribution prediction intervals (lib/forecast.py),
      compared against the strategy's own stated target trajectory
      (Ch.2: 2%/3%/5%/6%/7% GDP growth by Year 1-5, "#1 in SACU" by Year 5).
      Fiscal years approximated to calendar years (Year 1 = FY2026/27 ->
      2026, ..., Year 5 = FY2030/31 -> 2030) -- a real approximation,
      stated explicitly in every output row, not hidden.
      GDP growth is forecast on TWO windows, not one, because the data
      demanded it: the full 16-year history's slope is negative
      (~-0.24%/yr, dominated by the 2017-2020 decline and COVID shock)
      while the most recent 5 years alone show a positive slope
      (~+0.23%/yr) -- nearly a sign flip. Presenting only the full-history
      number would be technically-not-wrong but genuinely misleading;
      both windows are shown, clearly labelled, with neither presented as
      "the" answer. SACU rank has shown zero variance (exactly 4th) across
      all 6 years of history -- the model correctly projects "stays at
      4th", with an explicit note that a mathematically zero-width
      interval here means "no historical basis to expect change", not
      "guaranteed to never change". Jobs/industrialist counts are
      DELIBERATELY NOT forecast as a trend -- only one pipeline snapshot
      exists (Phase 4), and fitting a trend to one data point would be
      exactly the overclaiming this project has avoided everywhere else;
      a plain status-vs-target comparison is used instead
      (target_status_log.csv), clearly labelled as not a projection.
    inputs: [worldbank_macro, proxy_eci, pipeline_industrialists]
    script: scripts/compute_forecasts.py
    workflow: .github/workflows/compute-forecasts.yml
    trigger: "runs automatically after any of its 3 input sources updates, plus workflow_dispatch"
    outputs:
      - data/derived/forecast_log.csv
      - data/derived/target_status_log.csv

  - id: sector_watchlist
    category: cross-cutting
    status: active
    description: >
      Phase 9 -- the strategy's 13 named wage-goods (defensive) and
      emerging (offensive) sectors, each mapped to real HS 2-digit trade
      chapters and/or news tags checked directly against the live data
      before being assigned (not guessed from a generic HS code list).
      For wage-goods sectors, computes an import-dependency ratio
      (imports / (imports + exports)) -- directly operationalising the
      strategy's own import-substitution framing. Verified against real
      data: grains/poultry, energy, building materials, and pharma all
      show 96-99.9% import dependency, matching the strategy's own
      diagnosis closely. "Basic clothing" is the one exception (13.4%
      import dependency, i.e. export-dominated) -- BY DESIGN this is
      flagged as a real limitation, not smoothed over: HS 61/62 is the
      same chapter as Lesotho's large CMT export garment industry, so
      this cannot separate "basic clothing for domestic consumption"
      from "export-oriented manufacturing" at 2-digit granularity, and
      the number itself demonstrates why that caveat matters. Two
      sectors (Music/arts/sports, the "mountain economy") have NO
      matching trade code or news tag and are reported as genuinely
      untracked rather than forced into a proxy that doesn't fit --
      this doesn't fully close the dashboard's long-standing "5 new
      industrial sectors has no tracking source" gap, but every named
      sector now has a real, checked status instead of silence.
      UPDATE: once ReliefWeb's appname was approved, added a dedicated
      reliefweb_article_count field for grains_poultry specifically --
      the one sector where humanitarian/food-security reports (drought,
      food insecurity) bear directly enough to warrant a named field
      beyond the general news tags. Deliberately not extended to other
      sectors where the connection would be weaker or more speculative;
      the field is left blank (not zero) for those, and blank rather
      than a fabricated zero when the ReliefWeb source itself isn't
      available yet.
    inputs: [comtrade_sacu_basket, gdelt_general, reliefweb_signals]
    script: scripts/compute_sector_watchlist.py
    workflow: .github/workflows/compute-sector-watchlist.yml
    trigger: "runs automatically after any of its 3 input sources updates, plus workflow_dispatch"
    outputs:
      - data/derived/sector_watchlist_log.csv

  - id: trade_analytics
    category: cross-cutting
    status: active
    description: >
      Phase 10 -- three related computations built entirely from trade
      and macro data already ingested, no new sources.
      (1) DIVERSIFICATION INDEX: Herfindahl-Hirschman concentration index
      on each SACU country's export basket, 0-10,000 scale. Real, checked
      finding: Botswana sits at ~6371 (highly concentrated, consistent
      with its last-place Phase 2 complexity rank and diamond-dependent
      economy); Lesotho's HHI peaked in 2020 (1983) and has fallen every
      year since to 1447 (2024) -- a genuine, verified 4-year
      diversification trend. NOTE: an earlier draft of this claimed a
      monotonic decline from 2018, which a stricter assertion (checking
      the whole series, not just endpoints) caught as wrong -- concentration
      actually rose slightly 2018-2020 first. Corrected before shipping.
      Deliberately scoped to the SACU-regional trade basket, not the
      strategy's own GLOBAL product-space framing (Ch.1.4-1.5) -- a
      different comparison basis, not confirming or contradicting that
      claim directly.
      (2) EMERGING PRODUCTS: reuses Phase 2's regional-RCA method to
      detect products crossing the RCA>=1 threshold for the first time
      between consecutive years (real diversification signal), and the
      reverse (products losing that status), for both directions.
      (3) BALANCE-OF-PAYMENTS TRACKER: pulls together indicators the
      macro pipeline already fetches into one dedicated view with an
      explicit trade-gap figure (imports % GDP minus exports % GDP).
      Real, checked finding: Lesotho's imports reached 104.5% of GDP in
      2025 -- exceeding the size of the entire economy -- against exports
      of 49.5%, a 54.9-point gap, operationalising the strategy's own
      founding BOP-constraint diagnosis (Ch.1.3) as one direct number.
      A REAL BUG CAUGHT DURING THIS PHASE, not fixed elsewhere yet:
      pd.DataFrame([]).to_csv() writes a genuinely headerless, unreadable
      file when there are zero rows -- a latent risk in every earlier
      computation script using the same pattern without explicit column
      lists. Fixed here (see the script's DIVERSIFICATION_COLUMNS /
      EMERGING_COLUMNS / BOP_COLUMNS constants); NOT retroactively fixed
      in Phases 2/6/7's scripts, since none of them have hit this in
      practice with real data flowing, and auditing/changing working
      scripts from earlier phases is a separate, deliberate task, not a
      side effect of this one.
    inputs: [comtrade_sacu_basket, worldbank_macro]
    script: scripts/compute_trade_analytics.py
    workflow: .github/workflows/compute-trade-analytics.yml
    trigger: "runs automatically after either input source updates, plus workflow_dispatch"
    outputs:
      - data/derived/diversification_index_log.csv
      - data/derived/emerging_products_log.csv
      - data/derived/bop_tracker_log.csv

  - id: extended_forecasts
    category: cross-cutting
    status: active
    description: >
      Phase 11 -- more series forecast (manufacturing/FDI/unemployment/
      manufactured-exports % GDP), the CONTINUOUS complexity score
      (log_fitness_score, not just Phase 7's discrete rank), and a
      "required pace" gap analysis. Reuses lib/forecast.py exactly as
      Phase 7 built it; does NOT modify compute_forecasts.py itself
      (reads its output read-only for the GDP required-pace figure).
      CHECKED BEFORE WRITING ANY CODE, not assumed: every new series
      here shows the same full-history-vs-recent-5yr SIGN FLIP Phase 7
      found for GDP growth alone -- not a one-off, a systemic feature of
      this dataset (plausibly the same COVID-era structural break).
      Every forecast uses both windows for that reason. REAL FINDING:
      the continuous complexity score shows a sign flip invisible in the
      discrete rank (which has shown zero variance, always 4th) --
      full-history reads as slight improvement, recent 5 years read as
      decline. REQUIRED PACE gives GDP growth and the complexity score
      (against an IMPLICIT target: the current #1-ranked country's own
      score) an explicit "rate of change needed vs. rate of change
      happening" figure -- verified finding: the complexity score's
      recent trend is moving in the WRONG direction (-0.224 pts/yr)
      while closing the gap to South Africa's current score would need
      +3.576 pts/yr, a stark, honestly-reported gap. Deliberately does
      NOT compute required-pace for the ordinal SACU rank or for metrics
      with no stated numeric target (manufacturing/FDI/unemployment/
      HHI/trade-gap) -- reported as forecasts without a pace figure
      rather than inventing a target that doesn't exist.
    inputs: [worldbank_macro, proxy_eci, trade_analytics, forecasts]
    script: scripts/compute_extended_forecasts.py
    workflow: .github/workflows/compute-extended-forecasts.yml
    trigger: "runs automatically after any of its 4 input sources updates, plus workflow_dispatch"
    outputs:
      - data/derived/extended_forecast_log.csv
      - data/derived/required_pace_log.csv

  - id: cross_domain_insights
    category: cross-cutting
    status: active
    description: >
      Phase 12 -- three computations connecting data already sitting in
      separate files, no new sources. (1) ANOMALY <-> NEWS TOPICAL
      LINKING: runs each flagged anomaly's own descriptive label through
      lib/tagging.py's real tag_article() function (the same rules used
      to tag actual news) to find a plausible topic, then checks for
      current articles carrying that tag. CHECKED BEFORE BUILDING: the
      news archive spans about a week while anomalies describe 2023-2025
      data -- no temporal overlap exists, so this can only mean "does
      current news touch the same broad topic," never "this explains
      that anomaly." REAL, HONESTLY-REPORTED FINDING: only ~18% of
      flagged anomalies match any existing news category at all -- most
      trade anomalies are about specific HS product chapters the 17
      tracked categories were never built to cover. (2) NEWS-VOLUME
      ANOMALY DETECTION: reuses lib/anomaly.py's evaluate_latest_anomaly()
      exactly, pointed at daily article counts instead of a trade/macro
      series. HONESTLY FLAGGED as early-days output -- only ~7 days of
      news history exist yet, well below the ~21-day mark treated as
      minimally reliable; the mechanism is built now so it improves
      automatically as more daily pulls accumulate, not reported with
      false confidence today. (3) PEER-COUNTRY INSIGHTS: the same kind
      of plain-language narration Lesotho gets on the dashboard, applied
      to its SACU neighbours using data that already covers all 5
      members. REAL FINDINGS: Namibia and Eswatini have swapped 2nd/3rd
      place in SACU complexity ranking twice since 2018 (an ongoing
      rivalry Lesotho-only narration would never surface); Botswana's
      export concentration has eased 22% since 2018 even though its rank
      hasn't moved from last place -- real improvement not yet reflected
      in its ranking.
    inputs: [anomaly_signals, gdelt_general, proxy_eci, trade_analytics]
    script: scripts/compute_cross_domain_insights.py
    workflow: .github/workflows/compute-cross-domain-insights.yml
    trigger: "runs automatically after any of its 4 input sources updates, plus workflow_dispatch"
    outputs:
      - data/derived/anomaly_news_links_log.csv
      - data/derived/news_volume_anomalies_log.csv
      - data/derived/peer_insights_log.csv

  - id: commodity_signal
    category: cross-cutting
    status: active
    description: >
      Phase 13 — an honest substitute for wool/mohair and diamond PRICE
      data, which doesn't exist as a public API in any form (free or
      paid) because it's a structural fact about these markets, not a
      coverage gap: wool/mohair are sold at regional auctions (per-lot
      prices, not a continuous published series); diamonds are graded
      and priced per-stone, with no fungible spot market the way gold or
      oil have one. Rather than force a proxy that doesn't fit, this
      surfaces the real news-coverage signal already being tracked for
      these exact topics since Phase 3 (the wool_mohair_cashmere and
      mining_minerals tags) as the honest alternative, paired with a
      plain-language note stating why no price figure is shown.
    inputs: [gdelt_general]
    script: scripts/compute_commodity_signal.py
    workflow: .github/workflows/compute-commodity-signal.yml
    trigger: "runs automatically after gdelt_general updates, plus workflow_dispatch"
    outputs:
      - data/derived/commodity_signal_log.csv

  - id: sector_discovery
    category: cross-cutting
    status: active
    description: >
      Phase B of the predictive-analytics expansion (per the LNDC
      Industrial Intelligence Radar diagnostic report) -- the centrepiece
      capability the report's Chapter 8.2 and this expansion were
      requested for: automatically surfacing recurring, growing themes
      NOT already in the strategy's named 13-sector list, rather than
      only tracking sectors someone already thought to name. Deliberately
      NOT machine-learning topic modelling or clustering -- that was a
      considered choice, not a shortcut: an LDA/embeddings cluster's
      "meaning" has to be inferred after the fact, which is exactly the
      opaque, hard-to-verify output the report's own standing caution
      warns against (fluent output is not the same as correct output).
      Instead: extracts recurring 2-3 word phrases from real article
      titles (Phase A's global signal + the existing discovery feed of
      untagged Lesotho-relevant news), excludes anything already covered
      by the 13 named sectors or 17 existing news categories, and scores
      what's left by how many INDEPENDENT signal types corroborate it
      (news recurrence + a matching SACU trade-basket commodity
      description + a matching pipeline company sector) -- the report's
      own Chapter 3.1 principle that a signal in one channel should be
      cross-checked against another. Every output row links directly to
      the real headlines and records that produced it; nothing is a
      claim a human reviewer can't immediately verify.

      TWO REAL PROBLEMS FOUND AND FIXED DURING BUILD, BOTH VIA TESTING
      AGAINST REAL DATA, NOT ASSUMED WORKING: (1) a first real run
      surfaced almost entirely noise -- wire-service syndication credit
      lines ("APO Group - Africa Newsroom"), country names, and generic
      finance-market boilerplate ("insider sells stock") all recurring
      as if they were content. Fixed with a curated exclusion list for
      each pattern, found by inspecting real output, not guessed in
      advance. (2) counting raw article recurrence wrongly treated the
      same syndicated story (republished near-verbatim across several
      domains, sometimes with a minor prefix like "Business :" added) as
      independent corroboration. Fixed with Jaccard word-set similarity
      grouping (70% overlap threshold) to count DISTINCT STORIES, not
      distinct rows or even distinct domains alone -- confirmed directly
      against the real syndicated example that motivated the fix. A
      third bug (a word-length filter of >2 characters silently
      excluded "AI" -- exactly the kind of term this engine most needs
      to catch) was caught by a test built around a real headline
      example, fixed with a small explicit short-acronym allowlist.

      HONEST LIMITATION: with roughly 600 global-signal rows and 20
      discovery-feed rows at build time, this is genuinely thin data for
      confident GROWTH-trend detection (showing a phrase is accelerating
      needs real history to compare against). What it can honestly do
      today is candidate GENERATION -- phrases recurring across multiple
      independent real articles right now. Residual noise (person and
      company names recurring because the same regional/company story
      gets covered by several financial-news aggregators) can still
      surface; this is a screening list for a human reviewer to scan in
      a few minutes, exactly matching the report's own Chapter 8.3
      governance principle, not an autonomous, unreviewed output.

      UPDATE for Phase C: output switched from overwriting a fresh
      snapshot each run to APPENDING one, with a dedicated append_snapshot()
      function -- deliberately not lib/csv_log.py's append_new_rows(),
      whose key-based dedup would wrongly suppress a candidate's own
      metrics changing run over run. This keeps every run's snapshot as
      its own historical row, which compute_signal_corroboration.py (see
      below) needs to detect whether a candidate persists across
      multiple separate runs, not just within one.
    inputs: [anomaly_signals, global_signal]
    script: scripts/compute_sector_discovery.py
    workflow: .github/workflows/compute-sector-discovery.yml
    trigger: "runs automatically after either input source updates, plus workflow_dispatch"
    outputs:
      - data/derived/sector_discovery_log.csv

  - id: signal_corroboration
    category: cross-cutting
    status: active
    description: >
      Phase C of the predictive-analytics expansion (per the report's
      Chapter 3.1: a signal in one channel should be cross-checked
      against another) -- extends Phase B's discovery candidates with
      two signal types Phase B's own script never checks, plus temporal
      persistence now that sector_discovery's output is a genuine
      historical log rather than an overwritten snapshot. (1) TEMPORAL
      PERSISTENCE: a candidate recurring across multiple separate,
      independently-computed runs (spanning real elapsed days) is
      materially stronger evidence than appearing once. HONEST
      LIMITATION: this signal starts weak given how recently history
      started accumulating and gets more meaningful automatically over
      time, the same trajectory as this project's other "needs more
      history" signals. (2) ANOMALY CROSS-REFERENCE: does a candidate
      share meaningful words with any currently-flagged statistical
      anomaly's own label -- corroboration from a completely different
      detection method (z-score screening on real trade/macro data), not
      just recurring news. (3) PEER-INSIGHT CROSS-REFERENCE: does a
      candidate share meaningful words with a SACU peer-country finding.

      A REAL BUG FOUND AND FIXED DURING BUILD: a first real run showed
      "gold exports" (Ghana's policy) "matching" an unrelated Botswana
      export anomaly purely via the shared word "exports", and "africa
      chrome" matching three unrelated South African export anomalies
      purely via "africa" -- both near-universal words in nearly every
      trade-anomaly label regardless of actual subject. Fixed by
      excluding a curated set of generic/near-universal words before
      checking for overlap. A SECOND version of that fix (also requiring
      2+ shared words on top of the exclusion) was itself found to be
      too strict via testing -- it rejected "green hydrogen" matching
      "Hydrogen fuel cell components" (a genuine, specific, single-word
      match) -- and was removed once testing showed the exclusion list
      alone already correctly rejected both original false positives
      without it. HONEST REMAINING LIMITATION: a genuinely polysemous
      word (e.g. "solar" meaning either solar power or a solar eclipse)
      can still produce an occasional false match, since it isn't a
      generic/near-universal word the exclusion list would catch. Low
      cost: every corroboration claim links back to its source text, so
      a human reviewer dismisses a genuinely irrelevant match in seconds.
    inputs: [sector_discovery, anomaly_signals, cross_domain_insights]
    script: scripts/compute_signal_corroboration.py
    workflow: .github/workflows/compute-signal-corroboration.yml
    trigger: "runs automatically after any of its 3 input sources updates, plus workflow_dispatch"
    outputs:
      - data/derived/sector_corroboration_log.csv
